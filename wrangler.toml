name = "dj-booking"
main = "src/index.js"
type = "javascript"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespace pour les réservations
[[kv_namespaces]]
binding = "RESERVATIONS_KV"
id = "your-kv-id-here"
preview_id = "your-preview-kv-id-here"

# R2 Bucket pour les fichiers statiques (HTML, CSS, JS)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dj-booking-assets"
preview_bucket_name = "dj-booking-assets-preview"

# Variables d'environnement
[env.production]
route = "events.cax-corp.com/*"
zone_id = "your-zone-id-here"

[env.production.vars]
ENVIRONMENT = "production"

# Secrets (Webhook Discord)
# Ajouter via: wrangler secret put DISCORD_WEBHOOK


